<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

  <rect width="900" height="500" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">저장 → Commit → Push, 세 번을 거쳐야 올라갑니다</text>
  <text x="450" y="57" text-anchor="middle" font-size="12.5" fill="#6b7280">단계마다 GitHub Desktop 화면이 달라집니다 &#8212; <tspan font-weight="bold">지금 어디까지 왔는지 그걸로 확인하세요</tspan></text>

  <!-- ═══════════ 영역 ═══════════ -->
  <rect x="36" y="88" width="612" height="218" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="48" y="106" font-size="11.5" font-weight="bold" fill="#9ca3af">내 컴퓨터</text>

  <rect x="672" y="88" width="192" height="218" rx="6" fill="#f0f7f2" stroke="#86b89a" stroke-width="1.5"/>
  <text x="684" y="106" font-size="11.5" font-weight="bold" fill="#15803d">인터넷 (GitHub)</text>

  <!-- ═══════════ 단계 상자 ═══════════ -->
  <rect x="52" y="118" width="160" height="88" rx="5" fill="#f6f7f9" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="132" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Unity에서 작업</text>
  <text x="132" y="168" text-anchor="middle" font-size="11" fill="#6b7280">그림을 넣고</text>
  <text x="132" y="185" text-anchor="middle" font-size="11" fill="#6b7280">씬을 고치는 중</text>

  <rect x="262" y="118" width="160" height="88" rx="5" fill="#fff8e6" stroke="#c9a227" stroke-width="1.6"/>
  <text x="342" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f">내 폴더에 저장됨</text>
  <text x="342" y="168" text-anchor="middle" font-size="11" fill="#6b7280">파일이 실제로</text>
  <text x="342" y="185" text-anchor="middle" font-size="11" fill="#6b7280">바뀐 상태</text>

  <rect x="472" y="118" width="160" height="88" rx="5" fill="#e8f0fa" stroke="#2f74c0" stroke-width="1.6"/>
  <text x="552" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5fa8">내 컴퓨터에 기록됨</text>
  <text x="552" y="168" text-anchor="middle" font-size="11" fill="#6b7280">Commit 완료</text>
  <text x="552" y="185" text-anchor="middle" font-size="11" fill="#b91c1c">아직 인터넷엔 없음</text>

  <rect x="686" y="118" width="164" height="88" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="1.8"/>
  <text x="768" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">GitHub에 올라감</text>
  <text x="768" y="168" text-anchor="middle" font-size="11" fill="#3f6b52">Push 완료</text>
  <text x="768" y="185" text-anchor="middle" font-size="11" fill="#3f6b52">이제 안전합니다</text>

  <!-- ═══════════ 화살표 ═══════════ -->
  <line x1="214" y1="162" x2="250" y2="162" stroke="#4b5563" stroke-width="2"/>
  <polygon points="260,162 248,156 248,168" fill="#4b5563"/>
  <text x="237" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4b5563">Ctrl+S</text>

  <line x1="424" y1="162" x2="460" y2="162" stroke="#4b5563" stroke-width="2"/>
  <polygon points="470,162 458,156 458,168" fill="#4b5563"/>
  <text x="447" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4b5563">Commit</text>

  <line x1="634" y1="162" x2="672" y2="162" stroke="#15803d" stroke-width="2.4"/>
  <polygon points="684,162 670,155 670,169" fill="#15803d"/>
  <text x="657" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">Push</text>

  <!-- ═══════════ 확인 방법 ═══════════ -->
  <rect x="52" y="222" width="160" height="70" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.4"/>
  <text x="132" y="243" text-anchor="middle" font-size="10.5" fill="#9ca3af">GitHub Desktop 화면</text>
  <text x="132" y="264" text-anchor="middle" font-size="11" fill="#4b5563">아무것도</text>
  <text x="132" y="280" text-anchor="middle" font-size="11" fill="#4b5563">안 뜸</text>

  <rect x="262" y="222" width="160" height="70" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.4"/>
  <text x="342" y="243" text-anchor="middle" font-size="10.5" fill="#9ca3af">GitHub Desktop 화면</text>
  <text x="342" y="264" text-anchor="middle" font-size="11" fill="#4b5563">왼쪽에 바뀐</text>
  <text x="342" y="280" text-anchor="middle" font-size="11" fill="#4b5563">파일 목록이 뜸</text>

  <rect x="472" y="222" width="160" height="70" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.4"/>
  <text x="552" y="243" text-anchor="middle" font-size="10.5" fill="#9ca3af">GitHub Desktop 화면</text>
  <text x="552" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f5fa8">Push origin  1↑</text>
  <text x="552" y="280" text-anchor="middle" font-size="11" fill="#4b5563">목록은 비어 있음</text>

  <rect x="686" y="222" width="164" height="70" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.4"/>
  <text x="768" y="243" text-anchor="middle" font-size="10.5" fill="#9ca3af">GitHub Desktop 화면</text>
  <text x="768" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Fetch origin</text>
  <text x="768" y="280" text-anchor="middle" font-size="11" fill="#4b5563">1↑ 가 사라짐</text>

  <!-- ═══════════ Pull ═══════════ -->
  <path d="M768 310 V344 H342 V318" fill="none" stroke="#2f74c0" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="342,308 336,320 348,320" fill="#2f74c0"/>
  <text x="555" y="364" text-anchor="middle" font-size="11.5" fill="#2f74c0"><tspan font-weight="bold">Pull</tspan> &#8212; 다른 컴퓨터에서 이어서 할 때는 <tspan font-weight="bold">작업 시작 전에</tspan> 먼저 받아옵니다</text>

  <!-- ═══════════ 경고 ═══════════ -->
  <rect x="36" y="388" width="828" height="66" rx="5" fill="#fef2f2" stroke="#f0b0b0" stroke-width="1.5"/>
  <text x="56" y="412" font-size="13" font-weight="bold" fill="#b91c1c">Commit만 하고 Push를 안 하면 인터넷에는 아무것도 없습니다</text>
  <text x="56" y="435" font-size="11.5" font-weight="bold" fill="#b91c1c">가장 많이 하는 실수입니다. <tspan font-weight="normal">그 상태에서 컴퓨터가 고장 나면 작업이 그대로 사라집니다. <tspan font-weight="bold">1↑ 표시가 남아 있으면 아직 안 올라간 것</tspan>입니다.</tspan></text>

  <text x="450" y="482" text-anchor="middle" font-size="11" fill="#9ca3af">※ Unity에서 <tspan font-weight="bold">저장하지 않으면</tspan> 첫 칸에서 멈춰 있는 것이라, GitHub Desktop에는 올릴 것이 하나도 나타나지 않습니다.</text>

</svg>
