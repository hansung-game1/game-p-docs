  <rect width="900" height="640" fill="#ffffff"/>

  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">배경은 5겹이 서로 다른 속도로 흘러 깊이감을 만듭니다</text>
  <text x="450" y="55" text-anchor="middle" font-size="12.5" fill="#6b7280">StageBackground / bg1.png ~ bg5.png — 각 1920 × 1080px · 앞에서 뒤 순서</text>

