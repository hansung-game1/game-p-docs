  <rect x="430" y="470" width="419" height="52" rx="5" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="446" y="491" font-size="11.5" fill="#4b5563">5겹을 아무리 잘 그려도 <tspan font-weight="bold">명도가 다 비슷하면 평면으로 보입니다.</tspan></text>
  <text x="446" y="511" font-size="11.5" fill="#4b5563">러프 단계에서도 이 <tspan font-weight="bold">명도 단계 차이만큼은</tspan> 넣어두세요.</text>

  <rect x="430" y="532" width="419" height="52" rx="5" fill="#fdf8ee" stroke="#d9c4a0" stroke-width="1.3"/>
  <text x="446" y="553" font-size="11.5" font-weight="bold" fill="#a8721f">이음새 만드는 요령</text>
