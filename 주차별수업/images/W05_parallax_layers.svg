  <text x="51" y="292" font-size="11.5" fill="#4b5563">· bg1~bg4는 <tspan font-weight="bold">투명한 부분이 많을수록</tspan> 겹쳐 보일 때 깊이감이 살아납니다   ·   전부 좌우로 계속 반복되므로 <tspan font-weight="bold">이음새</tspan>가 티 나면 안 됩니다</text>

  <line x1="51" y1="312" x2="849" y2="312" stroke="#e5e7eb" stroke-width="1.5"/>

