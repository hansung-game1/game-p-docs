  <text x="51" y="562" font-size="11.5" fill="#4b5563">좌우로 이동하면 앞의 겹이 더 빨리 지나가면서 공간이 느껴집니다.</text>

  <!-- ═══════════ 공기원근 ═══════════ -->
  <text x="430" y="340" font-size="13.5" font-weight="bold" fill="#111827">★ 공기원근은 그림 자체에 그려 넣어야 합니다</text>
  <text x="430" y="358" font-size="11.5" fill="#6b7280">엔진이 자동으로 흐리게 해주지 않습니다</text>

  <rect x="430" y="372" width="82" height="46" fill="#42563a"/>
  <rect x="514" y="372" width="82" height="46" fill="#6b7f66"/>
  <rect x="598" y="372" width="82" height="46" fill="#8fa3a0"/>
  <rect x="682" y="372" width="82" height="46" fill="#adbfc9"/>
