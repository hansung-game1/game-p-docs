<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

  <defs>
    <g id="charS">
      <line x1="-4" y1="0" x2="-3" y2="-17" stroke="#1f5fa8" stroke-width="4" stroke-linecap="round"/>
      <line x1="4" y1="0" x2="3" y2="-17" stroke="#1f5fa8" stroke-width="4" stroke-linecap="round"/>
      <rect x="-6" y="-36" width="12" height="21" rx="3" fill="#2f74c0"/>
      <circle cx="0" cy="-42" r="6" fill="#2f74c0"/>
    </g>
  </defs>

  <rect width="900" height="620" fill="#ffffff"/>

  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">화면은 여러 겹이 순서대로 겹쳐서 그려집니다</text>
  <text x="450" y="55" text-anchor="middle" font-size="12.5" fill="#6b7280">숫자가 클수록 앞(위)에 그려집니다 — 뒤에 그려진 것이 앞의 것을 가립니다</text>

  <!-- ═══════════ 좌 : 레이어 스택 ═══════════ -->
  <text x="60" y="92" font-size="13.5" font-weight="bold" fill="#111827">겹치는 순서</text>

  <!-- 앞 -->
  <text x="60" y="118" font-size="11" font-weight="bold" fill="#dc2626">▲ 앞 (플레이어에게 가까움)</text>

  <!-- 바닥 20 -->
  <rect x="60" y="128" width="380" height="44" rx="5" fill="#f5efe6" stroke="#8a6f52" stroke-width="2"/>
  <rect x="60" y="128" width="8" height="44" rx="2" fill="#8a6f52"/>
  <text x="84" y="147" font-size="14" font-weight="bold" fill="#6d5740">바닥 (Ground)</text>
  <text x="84" y="164" font-size="11.5" fill="#8a7863">StageGround / ground1~7.png</text>
  <text x="428" y="155" text-anchor="end" font-size="16" font-weight="bold" fill="#8a6f52">20</text>

  <!-- 날씨 15 -->
  <rect x="60" y="180" width="380" height="40" rx="5" fill="#eef4f8" stroke="#7fa3bd" stroke-width="1.6"/>
  <rect x="60" y="180" width="8" height="40" rx="2" fill="#7fa3bd"/>
  <text x="84" y="197" font-size="13.5" font-weight="bold" fill="#4a6f8a">날씨 파티클</text>
  <text x="84" y="213" font-size="11.5" fill="#7b93a5">StageWeather / weather1~N.png</text>
  <text x="428" y="205" text-anchor="end" font-size="16" font-weight="bold" fill="#7fa3bd">15</text>

  <!-- 이펙트 12 -->
  <rect x="60" y="228" width="380" height="40" rx="5" fill="#fdf3e3" stroke="#d99b3c" stroke-width="1.6"/>
  <rect x="60" y="228" width="8" height="40" rx="2" fill="#d99b3c"/>
  <text x="84" y="245" font-size="13.5" font-weight="bold" fill="#a8721f">공격 이펙트</text>
  <text x="84" y="261" font-size="11.5" fill="#b8935a">Effects / effect_attack1_01.png 등</text>
  <text x="428" y="253" text-anchor="end" font-size="16" font-weight="bold" fill="#d99b3c">12</text>

  <!-- 플레이어 10 -->
  <rect x="60" y="276" width="380" height="44" rx="5" fill="#e8f0fa" stroke="#2f74c0" stroke-width="2"/>
  <rect x="60" y="276" width="8" height="44" rx="2" fill="#2f74c0"/>
  <text x="84" y="295" font-size="14" font-weight="bold" fill="#1f5fa8">플레이어 · 클리어 오브젝트</text>
  <text x="84" y="312" font-size="11.5" fill="#5d87bb">Player / LevelClearObject</text>
  <text x="428" y="303" text-anchor="end" font-size="16" font-weight="bold" fill="#2f74c0">10</text>

  <!-- 몬스터 8 -->
  <rect x="60" y="328" width="380" height="40" rx="5" fill="#f7ebf0" stroke="#b5527d" stroke-width="1.6"/>
  <rect x="60" y="328" width="8" height="40" rx="2" fill="#b5527d"/>
  <text x="84" y="345" font-size="13.5" font-weight="bold" fill="#93395f">몬스터 · HP 아이템 박스</text>
  <text x="84" y="361" font-size="11.5" fill="#b07d95">Monsters / Items</text>
  <text x="428" y="353" text-anchor="end" font-size="16" font-weight="bold" fill="#b5527d">8</text>

  <!-- 배경 -->
  <rect x="60" y="376" width="380" height="66" rx="5" fill="#eef2f5" stroke="#8fa3b3" stroke-width="1.6"/>
  <rect x="60" y="376" width="8" height="66" rx="2" fill="#8fa3b3"/>
  <text x="84" y="394" font-size="13.5" font-weight="bold" fill="#5b7385">배경 5겹 (패럴렉스)</text>
  <text x="84" y="411" font-size="11.5" fill="#8697a5">StageBackground / bg1.png ~ bg5.png</text>
  <text x="84" y="429" font-size="11" fill="#a8b6c1">bg1 = 0 · bg2 = -10 · bg3 = -20 · bg4 = -30 · bg5 = -40</text>
  <text x="428" y="400" text-anchor="end" font-size="15" font-weight="bold" fill="#8fa3b3">0 ~ -40</text>

  <text x="60" y="462" font-size="11" font-weight="bold" fill="#6b7280">▼ 뒤 (가장 멀리)</text>

  <!-- ═══════════ 우 : 실제 화면 ═══════════ -->
  <text x="500" y="92" font-size="13.5" font-weight="bold" fill="#111827">실제 화면에서는</text>

  <rect x="500" y="105" width="340" height="191" fill="#cfe4f2"/>
  <path d="M500 200 L560 178 L625 198 L695 172 L765 196 L840 182 L840 296 L500 296 Z" fill="#a9c4d6"/>
  <path d="M500 224 L558 208 L622 228 L698 206 L772 227 L840 214 L840 296 L500 296 Z" fill="#8fb0c6"/>

  <use href="#charS" x="620" y="261"/>
  <use href="#charS" x="700" y="261"/>

  <path d="M690 240 L716 232 L708 248 L730 244 L704 262 L710 248 L692 252 Z" fill="#f0a93b" opacity="0.92"/>

  <g fill="#ffffff" opacity="0.85">
    <circle cx="545" cy="150" r="3"/>
    <circle cx="600" cy="186" r="2.6"/>
    <circle cx="668" cy="140" r="3"/>
    <circle cx="742" cy="196" r="2.6"/>
    <circle cx="800" cy="158" r="3"/>
    <circle cx="580" cy="235" r="2.6"/>
    <circle cx="760" cy="128" r="2.6"/>
  </g>

  <path d="M500 261 L558 258 L622 262 L688 257 L748 261 L800 258 L840 261 L840 296 L500 296 Z" fill="#8a6f52"/>
  <path d="M500 261 L558 258 L622 262 L688 257 L748 261 L800 258 L840 261" fill="none" stroke="#6d5740" stroke-width="2"/>
  <g fill="#5f7a3f">
    <path d="M528 261 L524 246 L532 252 L536 240 L540 252 L548 246 L544 261 Z"/>
    <path d="M812 261 L808 248 L816 253 L820 242 L824 253 L832 248 L828 261 Z"/>
  </g>

  <rect x="500" y="105" width="340" height="191" fill="none" stroke="#374151" stroke-width="1.5"/>

  <line x1="620" y1="255" x2="592" y2="322" stroke="#6b7280" stroke-width="1.2"/>
  <text x="500" y="337" font-size="11.5" fill="#4b5563">캐릭터 · 몬스터는 배경보다 앞, 바닥보다 뒤</text>

  <line x1="716" y1="240" x2="760" y2="322" stroke="#6b7280" stroke-width="1.2"/>
  <text x="500" y="357" font-size="11.5" fill="#4b5563">이펙트는 캐릭터보다 앞 → 타격이 잘 보임</text>

  <line x1="532" y1="252" x2="512" y2="372" stroke="#6b7280" stroke-width="1.2"/>
  <text x="500" y="387" font-size="11.5" fill="#4b5563">바닥 위 풀은 캐릭터를 가림 → 깊이감</text>

  <text x="500" y="424" font-size="12" font-weight="bold" fill="#111827">이 순서는 코드에 고정되어 있습니다</text>
  <text x="500" y="443" font-size="11.5" fill="#6b7280">학생이 바꾸는 것이 아니라, 이 순서를 전제로</text>
  <text x="500" y="460" font-size="11.5" fill="#6b7280">그림을 그리면 됩니다.</text>

  <!-- ═══════════ 하단 요약 ═══════════ -->
  <line x1="60" y1="490" x2="840" y2="490" stroke="#e5e7eb" stroke-width="1.5"/>

  <text x="60" y="519" font-size="14" font-weight="bold" fill="#111827">그래서 그림을 그릴 때</text>

  <rect x="60" y="533" width="253" height="66" rx="5" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="76" y="554" font-size="12.5" font-weight="bold" fill="#6d5740">바닥</text>
  <text x="76" y="573" font-size="11.5" fill="#4b5563">200px 선 위쪽은 투명하게.</text>
  <text x="76" y="590" font-size="11.5" fill="#4b5563">칠하면 캐릭터가 가려집니다.</text>

  <rect x="323" y="533" width="253" height="66" rx="5" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="339" y="554" font-size="12.5" font-weight="bold" fill="#5b7385">배경</text>
  <text x="339" y="573" font-size="11.5" fill="#4b5563">대비를 낮춰 뒤로 물러나게.</text>
  <text x="339" y="590" font-size="11.5" fill="#4b5563">진하면 캐릭터가 묻힙니다.</text>

  <rect x="586" y="533" width="254" height="66" rx="5" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="602" y="554" font-size="12.5" font-weight="bold" fill="#a8721f">이펙트</text>
  <text x="602" y="573" font-size="11.5" fill="#4b5563">캐릭터 위에 덮여 그려집니다.</text>
  <text x="602" y="590" font-size="11.5" fill="#4b5563">밝고 짧게 = 타격감.</text>

</svg>
