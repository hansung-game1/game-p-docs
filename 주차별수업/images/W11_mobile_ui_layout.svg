<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

  <rect width="900" height="700" fill="#ffffff"/>

  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">모바일 터치 UI — 모바일 빌드에서만 화면에 나옵니다</text>
  <text x="450" y="55" text-anchor="middle" font-size="12.5" fill="#6b7280">UI / MobileControls — PC 빌드와 에디터 Play에서는 보이지 않는 것이 정상입니다</text>

  <!-- ═══════════ 화면 배치 ═══════════ -->
  <text x="50" y="92" font-size="13.5" font-weight="bold" fill="#111827">화면 배치 (1920 × 1080 안에서의 실제 비율)</text>

  <rect x="50" y="104" width="560" height="315" fill="#cfe4f2"/>
  <path d="M50 250 L150 218 L245 248 L340 212 L440 246 L540 222 L610 244 L610 419 L50 419 Z" fill="#a9c4d6"/>
  <path d="M50 300 L140 300 L240 304 L350 298 L460 303 L610 299 L610 419 L50 419 Z" fill="#8a6f52"/>

  <g>
    <line x1="322" y1="300" x2="320" y2="278" stroke="#1f5fa8" stroke-width="6" stroke-linecap="round"/>
    <line x1="334" y1="300" x2="336" y2="278" stroke="#1f5fa8" stroke-width="6" stroke-linecap="round"/>
    <rect x="320" y="248" width="16" height="34" rx="4" fill="#2f74c0"/>
    <circle cx="328" cy="239" r="9" fill="#2f74c0"/>
  </g>

  <!-- HUD -->
  <rect x="58" y="112" width="172" height="45" rx="3" fill="#ffffff" opacity="0.55"/>
  <rect x="58" y="112" width="172" height="45" rx="3" fill="none" stroke="#5b7385" stroke-width="1.1"/>
  <text x="144" y="139" text-anchor="middle" font-size="10" fill="#4b5563">HP · 스페셜 게이지</text>

  <circle cx="584" cy="130" r="18" fill="#ffffff" opacity="0.55"/>
  <circle cx="584" cy="130" r="18" fill="none" stroke="#5b7385" stroke-width="1.1"/>
  <text x="584" y="134" text-anchor="middle" font-size="10" fill="#4b5563">⚙</text>

  <!-- 조이스틱 -->
  <circle cx="118" cy="348" r="48" fill="#ffffff" opacity="0.45"/>
  <circle cx="118" cy="348" r="48" fill="none" stroke="#37546b" stroke-width="2.2"/>
  <circle cx="130" cy="340" r="21" fill="#ffffff" opacity="0.75"/>
  <circle cx="130" cy="340" r="21" fill="none" stroke="#37546b" stroke-width="1.8"/>

  <line x1="118" y1="396" x2="118" y2="300" stroke="#37546b" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- 버튼 4종 -->
  <g>
    <circle cx="472" cy="304" r="32" fill="#ffffff" opacity="0.45"/>
    <circle cx="472" cy="304" r="32" fill="none" stroke="#37546b" stroke-width="2"/>
    <path d="M462 312 L478 296 M472 292 L480 294 L478 302" stroke="#37546b" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <circle cx="548" cy="304" r="32" fill="#ffffff" opacity="0.45"/>
    <circle cx="548" cy="304" r="32" fill="none" stroke="#37546b" stroke-width="2"/>
    <path d="M548 292 L548 316 M540 300 L548 291 L556 300" stroke="#37546b" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <circle cx="472" cy="374" r="32" fill="#ffffff" opacity="0.45"/>
    <circle cx="472" cy="374" r="32" fill="none" stroke="#37546b" stroke-width="2"/>
    <path d="M462 366 L470 374 L462 382 M474 366 L482 374 L474 382" stroke="#37546b" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <circle cx="548" cy="374" r="32" fill="#ffffff" opacity="0.45"/>
    <circle cx="548" cy="374" r="32" fill="none" stroke="#37546b" stroke-width="2"/>
    <path d="M548 360 L552 370 L562 374 L552 378 L548 388 L544 378 L534 374 L544 370 Z" fill="#37546b"/>
  </g>

  <rect x="50" y="104" width="560" height="315" fill="none" stroke="#374151" stroke-width="1.5"/>

  <text x="118" y="410" text-anchor="middle" font-size="10" font-weight="bold" fill="#233b4d">이동</text>
  <text x="472" y="345" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#233b4d">공격</text>
  <text x="548" y="345" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#233b4d">점프</text>
  <text x="472" y="415" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#233b4d">대시</text>
  <text x="548" y="415" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#233b4d">필살기</text>

  <!-- ═══════════ 파일 목록 ═══════════ -->
  <rect x="638" y="104" width="212" height="315" rx="5" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/>
  <text x="654" y="126" font-size="12.5" font-weight="bold" fill="#111827">파일 목록 — 총 10장</text>

  <text x="654" y="152" font-size="11.5" font-weight="bold" fill="#37546b">조이스틱 · 331 × 331px</text>
  <text x="662" y="171" font-size="10.5" fill="#4b5563">joystick_frame.png</text>
  <text x="662" y="188" font-size="10.5" fill="#4b5563">joystick_stick.png</text>
  <text x="662" y="205" font-size="10" fill="#9ca3af">두 장이 같은 크기 — stick은</text>
  <text x="662" y="220" font-size="10" fill="#9ca3af">캔버스 안에서 작게 그립니다</text>

  <line x1="654" y1="234" x2="834" y2="234" stroke="#e5e7eb" stroke-width="1.2"/>

  <text x="654" y="254" font-size="11.5" font-weight="bold" fill="#37546b">버튼 4종 · 각 222 × 222px</text>
  <text x="662" y="273" font-size="10.5" fill="#4b5563">attack_button</text>
  <text x="662" y="290" font-size="10.5" fill="#4b5563">jump_button</text>
  <text x="662" y="307" font-size="10.5" fill="#4b5563">dash_button</text>
  <text x="662" y="324" font-size="10.5" fill="#4b5563">attack_special_button</text>
  <text x="662" y="344" font-size="10" fill="#9ca3af">각각 _normal / _pressed 2장씩</text>

  <line x1="654" y1="358" x2="834" y2="358" stroke="#e5e7eb" stroke-width="1.2"/>

  <text x="654" y="378" font-size="10.5" fill="#4b5563">공격과 필살기가 <tspan font-weight="bold">분리</tspan>되어 있습니다.</text>
  <text x="654" y="396" font-size="10.5" fill="#4b5563">PC의 J(공격) / K(차지)와 같습니다.</text>

  <!-- ═══════════ 구분선 ═══════════ -->
  <line x1="50" y1="448" x2="850" y2="448" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ═══════════ 2상태 vs 3상태 ═══════════ -->
  <text x="50" y="478" font-size="14" font-weight="bold" fill="#111827">터치 버튼은 2상태입니다 — hover가 없기 때문</text>

  <rect x="50" y="492" width="380" height="98" rx="5" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/>
  <text x="66" y="514" font-size="11.5" font-weight="bold" fill="#6b7280">PC 버튼 — 3상태</text>
  <g>
    <rect x="66" y="524" width="100" height="28" rx="4" fill="#e8eef5" stroke="#6b87a8" stroke-width="1.4"/>
    <text x="116" y="542" text-anchor="middle" font-size="10" fill="#3f5a78">normal</text>
    <rect x="176" y="524" width="100" height="28" rx="4" fill="#f7fbff" stroke="#2f74c0" stroke-width="1.8"/>
    <text x="226" y="542" text-anchor="middle" font-size="10" fill="#1f5fa8">hover</text>
    <rect x="286" y="524" width="100" height="28" rx="4" fill="#c9d6e4" stroke="#48607c" stroke-width="1.4"/>
    <text x="336" y="542" text-anchor="middle" font-size="10" fill="#2c4159">click</text>
  </g>
  <text x="66" y="574" font-size="11" fill="#4b5563">마우스를 &#8220;올려놓은&#8221; 상태가 있습니다.</text>

  <rect x="450" y="492" width="400" height="98" rx="5" fill="#f0f7f2" stroke="#86b89a" stroke-width="1.4"/>
  <text x="466" y="514" font-size="11.5" font-weight="bold" fill="#15803d">모바일 버튼 — 2상태</text>
  <g>
    <circle cx="512" cy="540" r="20" fill="#e8eef5" stroke="#6b87a8" stroke-width="1.6"/>
    <text x="512" y="544" text-anchor="middle" font-size="9" fill="#3f5a78">normal</text>
    <circle cx="592" cy="540" r="20" fill="#9db6cf" stroke="#37546b" stroke-width="2.2"/>
    <text x="592" y="544" text-anchor="middle" font-size="9" fill="#22384a">pressed</text>
  </g>
  <text x="640" y="536" font-size="11" fill="#3f6b52">터치는 닿거나 안 닿거나 둘뿐입니다.</text>
  <text x="640" y="554" font-size="11" fill="#3f6b52">손가락에 가려지므로 <tspan font-weight="bold">눌린 상태를</tspan></text>
  <text x="640" y="571" font-size="11" fill="#3f6b52"><tspan font-weight="bold">확실히 다르게</tspan> 만드세요.</text>

  <!-- ═══════════ 디자인 지침 ═══════════ -->
  <text x="50" y="622" font-size="13.5" font-weight="bold" fill="#111827">디자인할 때</text>

  <rect x="50" y="634" width="256" height="50" rx="5" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="66" y="654" font-size="11.5" font-weight="bold" fill="#37546b">반투명하게</text>
  <text x="66" y="672" font-size="11" fill="#4b5563">불투명하면 게임 화면을 가립니다.</text>

  <rect x="322" y="634" width="256" height="50" rx="5" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="338" y="654" font-size="11.5" font-weight="bold" fill="#37546b">버튼 간격을 충분히</text>
  <text x="338" y="672" font-size="11" fill="#4b5563">붙어 있으면 옆 버튼이 눌립니다.</text>

  <rect x="594" y="634" width="256" height="50" rx="5" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="610" y="654" font-size="11.5" font-weight="bold" fill="#37546b">아이콘은 직관적으로</text>
  <text x="610" y="672" font-size="11" fill="#4b5563">글자보다 그림이 빨리 읽힙니다.</text>

</svg>
